name: 正式发布

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: 校验正式版本标签
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 只接受规范稳定版本
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

      - name: 检出代码
        uses: actions/checkout@v4

  android:
    name: 构建 Android 正式安装包
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 校验 tag 与应用版本
        working-directory: android
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_VERSION="$(./gradlew -q printVersionName)"
          test "$SOURCE_VERSION" = "$VERSION"

      - name: 恢复 Android 签名密钥
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/woo-todo-release.jks
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_ALIAS"
          test -n "$ANDROID_SIGNING_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_SIGNING_STORE_FILE"
          chmod 600 "$ANDROID_SIGNING_STORE_FILE"
          echo "ANDROID_SIGNING_STORE_FILE=$ANDROID_SIGNING_STORE_FILE" >> "$GITHUB_ENV"

      - name: 测试、检查并构建正式 APK
        working-directory: android
        run: ./gradlew testReleaseUnitTest lintRelease assembleRelease

      - name: 验证签名并整理产物
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          test -f "$APK"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p release
          cp "$APK" "release/Woo-Todo-${GITHUB_REF_NAME}-android.apk"

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: 清理签名密钥
        if: always()
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/woo-todo-release.jks
        run: rm -f "$ANDROID_SIGNING_STORE_FILE"

  macos:
    name: 构建 macOS Apple Silicon ZIP
    needs: validate-tag
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
      MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      MACOS_DEVELOPER_ID_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 验证 Runner 架构
        run: test "$(uname -m)" = "arm64"

      - name: 运行 Swift 全量测试
        run: swift test --package-path macos

      - name: 恢复可选 Developer ID 签名身份
        if: env.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          test -n "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD"
          test -n "$MACOS_DEVELOPER_ID_IDENTITY"
          CERTIFICATE="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/woo-todo-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" \
            -k "$KEYCHAIN" \
            -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$MACOS_DEVELOPER_ID_IDENTITY"
          echo "CODE_SIGN_IDENTITY=$MACOS_DEVELOPER_ID_IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: 打包并验证应用
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Resources/Info.plist)"
          test "$SOURCE_VERSION" = "$VERSION"
          MARKETING_VERSION="$VERSION" BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            ./macos/scripts/package-app.sh --zip
          APP="macos/dist/Woo Todo.app"
          ZIP="macos/dist/Woo Todo-$VERSION-macos.zip"
          test -d "$APP"
          test -f "$ZIP"
          test "$(lipo -archs "$APP/Contents/MacOS/woo-todo-mac")" = "arm64"
          otool -l "$APP/Contents/MacOS/woo-todo-mac" | \
            awk '$1 == "cmd" && $2 == "LC_RPATH" { reading = 1; next } reading && $1 == "path" { print $2; reading = 0 }' | \
            grep -Fx '@executable_path/../Frameworks'
          test -f "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p release
          mv "$ZIP" "release/Woo-Todo-${GITHUB_REF_NAME}-macos-arm64.zip"

      - name: 生成并校验 Sparkle 更新源
        run: |
          set -euo pipefail
          test -n "$SPARKLE_ED25519_PRIVATE_KEY"
          ARCHIVE="Woo-Todo-${GITHUB_REF_NAME}-macos-arm64.zip"
          APPCAST_DIR="$RUNNER_TEMP/woo-todo-appcast"
          mkdir -p "$APPCAST_DIR"
          cp "release/$ARCHIVE" "$APPCAST_DIR/$ARCHIVE"
          printf '%s' "$SPARKLE_ED25519_PRIVATE_KEY" | \
            macos/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/stophemo/woo-todo/releases/download/${GITHUB_REF_NAME}/" \
              --link "https://woo-todo.vercel.app" \
              --maximum-versions 1 \
              --maximum-deltas 0 \
              -o "$APPCAST_DIR/appcast.xml" \
              "$APPCAST_DIR"
          grep -F "sparkle:edSignature=" "$APPCAST_DIR/appcast.xml"
          grep -F "url=\"https://github.com/stophemo/woo-todo/releases/download/${GITHUB_REF_NAME}/$ARCHIVE\"" \
            "$APPCAST_DIR/appcast.xml"
          cp "$APPCAST_DIR/appcast.xml" release/appcast.xml

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/*.zip
            release/appcast.xml
          if-no-files-found: error
          retention-days: 7

      - name: 清理 macOS 签名钥匙串
        if: always() && env.MACOS_SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$MACOS_SIGNING_KEYCHAIN"

  windows:
    name: 发布 Windows x64 实验版（不保证可用）
    needs: validate-tag
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            shared/core-rust -> target
            windows -> target

      - name: 校验 tag 与 Windows 版本
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME -replace "^v", ""
          $metadata = cargo metadata --manifest-path windows/Cargo.toml --format-version 1 --no-deps |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "cargo metadata 失败，退出码：$LASTEXITCODE"
          }
          $package = @($metadata.packages | Where-Object { $_.name -eq "woo-todo-windows" })
          if ($package.Count -ne 1) {
            throw "无法从 windows/Cargo.toml 唯一确定 woo-todo-windows 包"
          }
          $sourceVersion = [string] $package[0].version
          if ($sourceVersion -ne $version) {
            throw "Windows 源码版本 $sourceVersion 与 tag $version 不一致"
          }

      - name: 检查 Windows Rust 格式
        run: cargo fmt --manifest-path windows/Cargo.toml --all -- --check

      - name: 运行 Windows Rust 全量测试
        run: cargo test --manifest-path windows/Cargo.toml --locked --all-targets

      - name: 检查 Windows Rust 目标
        run: cargo check --manifest-path windows/Cargo.toml --locked --all-targets

      - name: 检查 Windows Rust 静态诊断
        run: cargo clippy --manifest-path windows/Cargo.toml --locked --all-targets -- -D warnings

      - name: 打包 Windows 实验版（不保证可用）免安装 ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME -replace "^v", ""
          ./windows/scripts/package.ps1 -Version $version
          $archive = "windows/dist/Woo-Todo-v$version-windows-x64-experimental.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "没有找到 Windows 实验版 ZIP：$archive"
          }
          $entries = @(tar -tf $archive)
          if ($entries -notcontains "WooTodo.exe" -or $entries -notcontains "WINDOWS-EXPERIMENTAL.txt") {
            throw "Windows 实验包缺少 WooTodo.exe 或 WINDOWS-EXPERIMENTAL.txt"
          }
          New-Item -ItemType Directory -Path "windows-experimental" -Force | Out-Null
          Copy-Item -LiteralPath $archive -Destination "windows-experimental/Woo-Todo-$($env:GITHUB_REF_NAME)-windows-x64-experimental.zip"
          $experimentalArchive = Get-ChildItem -LiteralPath "windows-experimental" -Filter "*-experimental.zip" -File |
            Select-Object -First 1
          $archiveHash = Get-FileHash -Algorithm SHA256 $experimentalArchive.FullName
          $checksumPath = Join-Path (Get-Location) "windows-experimental/SHA256SUMS-windows-experimental.txt"
          $checksumLine = "$($archiveHash.Hash.ToLower())  $([IO.Path]::GetFileName($archiveHash.Path))`n"
          [IO.File]::WriteAllText($checksumPath, $checksumLine, [Text.UTF8Encoding]::new($false))

      - name: 上传 Windows 实验版工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-experimental
          path: windows-experimental/*
          if-no-files-found: error
          retention-days: 30

      - name: 创建独立的 Windows 实验版 GitHub Prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $experimentalTag = "windows-$($env:GITHUB_REF_NAME)-experimental"
          $title = "Woo Todo Windows $($env:GITHUB_REF_NAME) 实验版（不保证可用）"
          @"
          ## Windows 实验版（不保证可用）

          此构建仅用于开发测试，不属于 Woo Todo 正式发布通道，也不保证能够正常启动或使用。
          功能可能不完整，并可能存在稳定性或数据兼容风险；请勿用于唯一或重要任务数据。
          Windows 实验版暂不提供应用内自动更新，后续版本需手动下载并替换 `WooTodo.exe`。
          "@ | Set-Content -LiteralPath "windows-experimental/RELEASE_NOTES.md" -Encoding utf8
          $experimentalArchive = Get-ChildItem -LiteralPath "windows-experimental" -Filter "*-experimental.zip" -File |
            Select-Object -First 1
          $checksum = Get-Item -LiteralPath "windows-experimental/SHA256SUMS-windows-experimental.txt"
          if (gh release view $experimentalTag 2>$null) {
            gh release upload $experimentalTag $experimentalArchive.FullName $checksum.FullName --clobber
            gh release edit $experimentalTag --title $title --notes-file windows-experimental/RELEASE_NOTES.md --prerelease
          } else {
            gh release create $experimentalTag $experimentalArchive.FullName $checksum.FullName `
              --target $env:GITHUB_SHA `
              --title $title `
              --notes-file windows-experimental/RELEASE_NOTES.md `
              --prerelease
          }

  publish:
    name: 创建 GitHub Release
    needs:
      - android
      - macos
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 Android 正式版产物
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release

      - name: 下载 macOS 正式版产物
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release

      - name: 生成 SHA-256 校验文件
        run: |
          set -euo pipefail
          cd release
          test "$(find . -maxdepth 1 -type f \( -name '*.apk' -o -name '*.zip' \) | wc -l | tr -d ' ')" = "2"
          test -z "$(find . -maxdepth 1 -type f \( -iname '*windows*' -o -iname '*preview*' -o -iname '*experimental*' \) -print -quit)"
          shasum -a 256 ./*.apk ./*.zip > SHA256SUMS.txt

      - name: 发布产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Woo Todo $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --title "Woo Todo $GITHUB_REF_NAME" \
              --generate-notes
          fi
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Eiq 'windows|preview|experimental'; then
            echo "正式 Release 中不得包含 Windows、preview 或 experimental 产物" >&2
            exit 1
          fi
