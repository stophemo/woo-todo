[package]
name = "woo-todo-windows"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Woo Todo Windows Tauri 2 客户端"
build = "build.rs"

[[bin]]
name = "WooTodo"
path = "src/main.rs"

[features]
legacy-win32 = []

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
icu_calendar = { version = "2.2", features = ["compiled_data"] }
quick-xml = "0.38"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
url = "2"
woo_todo_core = { path = "../shared/core-rust" }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
windows = { version = "0.62.2", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.20.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"
